name: Build and Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Extract Project Version
        id: get_version
        shell: bash
        run: |
          # Extract version from pom.xml using a simple grep/sed or mvn command
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Application with Maven
        run: mvn clean package -DskipTests

      - name: Generate Runtime Image with jlink
        run: mvn javafx:jlink

      - name: Package Application with jpackage
        run: |
          jpackage --type app-image `
            --name TimerApp `
            --app-version "${{ env.APP_VERSION }}" `
            --module com.dpzstudio.timer/com.dpzstudio.timer.App `
            --runtime-image target/TimerApp `
            --dest target/dist

      - name: Zip Portable Distribution
        run: |
          Compress-Archive -Path target/dist/TimerApp -DestinationPath "app-portable-${{ env.APP_VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          prerelease: true
          draft: false
          files: app-portable-${{ env.APP_VERSION }}.zip
