name: Build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Application with Maven
        run: mvn clean package -DskipTests

      - name: Generate Dynamic Release Tag
        run: |
          echo "TAG_NAME=v1.0.0-dev.${{ github.run_number }}" >> $env:GITHUB_ENV

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Development Release ${{ env.TAG_NAME }}
          prerelease: true
          draft: false
          files: |
            target/*.jar 
            target/*.exe
            target/*.zip
