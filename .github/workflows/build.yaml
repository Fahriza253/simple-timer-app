name: Build and Release

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    outputs:
      app_version: ${{ steps.get_version.outputs.VERSION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Extract Project Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Application with Maven
        run: mvn clean package -DskipTests

      - name: Generate Runtime Image with jlink
        run: mvn javafx:jlink

      - name: Package Application with jpackage (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          jpackage --type app-image \
            --name TimerApp \
            --app-version "${{ steps.get_version.outputs.VERSION }}" \
            --module com.dpzstudio.timer/com.dpzstudio.timer.App \
            --runtime-image target/TimerApp \
            --dest target/dist

      - name: Zip Portable Distribution (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Compress-Archive -Path target/dist/TimerApp -DestinationPath "TimerApp-windows-${{ steps.get_version.outputs.VERSION }}.zip" -Force

      - name: Package Application with jpackage (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          jpackage --type app-image \
            --name TimerApp \
            --app-version "${{ steps.get_version.outputs.VERSION }}" \
            --module com.dpzstudio.timer/com.dpzstudio.timer.App \
            --runtime-image target/TimerApp \
            --dest target/dist

      - name: Tar Portable Distribution (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tar -czf "TimerApp-linux-${{ steps.get_version.outputs.VERSION }}.tar.gz" -C target/dist TimerApp

      - name: Upload Intermediary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portable-packages-${{ matrix.os }}
          path: |
            *.zip
            *.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: portable-packages-*
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.app_version }}
          name: Release v${{ needs.build.outputs.app_version }}
          prerelease: true
          draft: false
          make_latest: true
          files: |
            TimerApp-windows-${{ needs.build.outputs.app_version }}.zip
            TimerApp-linux-${{ needs.build.outputs.app_version }}.tar.gz
